name: Package Windows release
description: Finish the build, sign binaries, create and sign the installer, and upload packages
inputs:
  from_artifact:
    description: Restore the build tree from a previous job
    default: true
  arch:
    description: Target architecture (x86_64 or arm64)
    required: true
  sign:
    description: Authenticode-sign when true. Otherwise package unsigned builds.
    required: false
    default: 'false'
  azure-tenant-id:
    description: AZURE_TENANT_ID
    required: false
    default: ''
  azure-client-id:
    description: AZURE_CLIENT_ID
    required: false
    default: ''
  azure-client-secret:
    description: AZURE_CLIENT_SECRET
    required: false
    default: ''
  azure-signing-endpoint:
    description: AZURE_SIGNING_ENDPOINT
    required: false
    default: ''
  azure-signing-account:
    description: AZURE_SIGNING_ACCOUNT
    required: false
    default: ''
  azure-signing-certificate-name:
    description: AZURE_SIGNING_CERTIFICATE_NAME
    required: false
    default: ''
outputs:
  version:
    description: Version of the packaged release
    value: ${{ steps.stage3.outputs.version }}
runs:
  using: composite
  steps:
    - name: Run Stage
      id: stage
      uses: ./.github/actions/stage
      with:
        arm: ${{ inputs.arch == 'arm64' }}
        from_artifact: ${{ inputs.from_artifact }}
        save_artifact: false

    - name: Check build completed
      if: steps.stage.outputs.finished != 'true'
      shell: pwsh
      run: throw 'Build did not finish within the available stages'

    - name: Set up signing runtime
      if: inputs.sign == 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Sign and package release
      id: release
      shell: pwsh
      working-directory: C:\helium-windows
      env:
        SIGN: ${{ inputs.sign }}
        TARGET_ARCH: ${{ inputs.arch == 'arm64' && 'arm64' || 'x64' }}
        AZURE_TENANT_ID: ${{ inputs.azure-tenant-id }}
        AZURE_CLIENT_ID: ${{ inputs.azure-client-id }}
        AZURE_CLIENT_SECRET: ${{ inputs.azure-client-secret }}
        AZURE_SIGNING_ENDPOINT: ${{ inputs.azure-signing-endpoint }}
        AZURE_SIGNING_ACCOUNT: ${{ inputs.azure-signing-account }}
        AZURE_SIGNING_CERTIFICATE_NAME: ${{ inputs.azure-signing-certificate-name }}
      run: |
        if ($env:SIGN -eq 'true') {
          nuget install Microsoft.ArtifactSigning.Client -Version 1.0.128 -ExcludeVersion -NonInteractive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install pywin32==311
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python signing.py --arch $env:TARGET_ARCH --dlib Microsoft.ArtifactSigning.Client/bin/x64/Azure.CodeSigning.Dlib.dll
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        } else {
          Write-Host 'Azure signing is off. Packaging unsigned Tinparatan artifacts.'
          python package.py --output-dir build\packages
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT,
            "artifacts=C:\helium-windows\build\packages`n")
        }

    - name: Upload symbols
      uses: actions/upload-artifact@v4
      with:
        name: tinparatan-windows-${{ inputs.arch }}-symbols
        path: |
          C:\helium-windows\build\src\out\Default\*.pdb
          C:\helium-windows\build\src\out\Default\*.exe
          C:\helium-windows\build\src\out\Default\*.dll
        if-no-files-found: error
        retention-days: 4
        overwrite: true

    - name: Upload artifacts
      id: stage3
      uses: ./.github/actions/stage
      with:
        upload_final: true
        final_directory: ${{ steps.release.outputs.artifacts }}
        arm: ${{ inputs.arch == 'arm64' }}
        from_artifact: false

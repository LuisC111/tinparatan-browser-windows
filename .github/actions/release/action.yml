name: Publish Windows release
description: Download both architecture packages and publish a prerelease with changelogs
inputs:
  version:
    description: Version to use for the release and tag
    required: true
runs:
  using: composite
  steps:
    - name: Download package
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: tinparatan-x86_64
        path: release-artifacts
    - name: Download arm package
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: tinparatan-arm64
        path: release-artifacts
    - name: Create release notes
      shell: bash
      run: |
        GH_RUN_HREF="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        if ! LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
          {
            printf 'First Windows build of Tinparatan from this fork.\n\n'
            printf '### tinparatan-browser-windows\n```\n'
            git log --oneline
            printf '```\n\n---\n\n'
            printf 'See [this GitHub Actions Run](%s) for the [Workflow file](%s/workflow) used as well as the build logs and artifacts\n' "$GH_RUN_HREF" "$GH_RUN_HREF"
          } | tee ./github_release_note.md
          exit 0
        fi
        submodule_commit_at() {
            git ls-tree "$1" helium-chromium | awk '{print $3}'
        }
        LAST_TAG=$(git describe --tags --abbrev=0)
        COMMIT_THEN=$(submodule_commit_at "$LAST_TAG")
        COMMIT_NOW=$(submodule_commit_at HEAD)
        {
          printf 'Changes since last build:\n### tinparatan-browser-windows\n```\n'
          git log --oneline "$LAST_TAG..HEAD"
          printf '```\n\n### tinparatan-browser\n```\n'
          git -C helium-chromium log --oneline "$COMMIT_THEN..$COMMIT_NOW"
          printf '```\n\n---\n\n'
          printf 'See [this GitHub Actions Run](%s) for the [Workflow file](%s/workflow) used as well as the build logs and artifacts\n' "$GH_RUN_HREF" "$GH_RUN_HREF"
        } | tee ./github_release_note.md
    - name: Publish release
      id: publish
      uses: imputnet/action-gh-release@v2.5
      with:
        fail_on_unmatched_files: true
        body_path: ./github_release_note.md
        prerelease: true
        name: ${{ inputs.version }}
        tag_name: ${{ inputs.version }}
        files: |
          release-artifacts/tinparatan*
